name: Feature request
description: Suggest an idea for ForumREXAR
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like ForumREXAR to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: Who would use it, and what problem does it solve?
